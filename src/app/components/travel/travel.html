<section class="travel-map">
  <header class="travel-header">
    <h1>Places I've Been</h1>
  </header>

  <div class="map-wrapper">
    <div class="map-inner">
      <img
        src="assets/maps/world-authagraph-dark.png"
        alt="World map"
        class="map-image"
      />

      <button
        *ngFor="let country of visited"
        class="map-star"
        [style.left.%]="country.x"
        [style.top.%]="country.y"
        (click)="open(country)"
      ></button>
    </div>
  </div>

  <div class="popup" *ngIf="active">
    <button class="popup-close" (click)="close()">×</button>
    <h3>{{ active.label }}</h3>
  </div>
</section>
