<!-- TAB BAR -->
<div class="skills-tabs fade-up stagger" role="tablist">

  <button
    class="skills-tab"
    role="tab"
    [attr.aria-selected]="activeTab === 0"
    (click)="selectTab(0)"
    [class.active]="activeTab === 0"
    style="--i:1"
  >
    <i class="bi bi-cpu"></i>
    Technical
  </button>

  <button
    class="skills-tab"
    role="tab"
    [attr.aria-selected]="activeTab === 1"
    (click)="selectTab(1)"
    [class.active]="activeTab === 1"
    style="--i:2"
  >
    <i class="bi bi-briefcase"></i>
    Professional
  </button>

  <button
    class="skills-tab"
    role="tab"
    [attr.aria-selected]="activeTab === 2"
    (click)="selectTab(2)"
    [class.active]="activeTab === 2"
    style="--i:3"
  >
    <i class="bi bi-mortarboard"></i>
    Academic
  </button>

</div>

<!-- CONTENT PANEL -->
<div class="skills-content-wrapper">

  <div
    class="skills-content"
    *ngIf="activeTab !== null"
    @fadeContent
    role="tabpanel"
  >
    <h2 class="skills-content-title">{{ activeSkillTitle }}</h2>

    <div class="skill-group" *ngFor="let group of activeSkillGroups">
      <h4 class="skill-group-title">{{ group.title }}</h4>

      <div class="skill-tags">
        <span
          class="skill-tag"
          *ngFor="let tag of group.tags; let t = index"
          [style.--tag-i]="t"
        >
          {{ tag }}
        </span>
      </div>
    </div>

  </div>

</div>
