<section class="short-clips-section fade-up">
  <h3 class="rowing-section-heading">Action Shots</h3>
  <div
    class="short-clips-track glass"
    #actionTrack
    (mousedown)="onDragStart($event)"
    (mousemove)="onDragMove($event)"
    (mouseup)="onDragEnd()"
    (mouseleave)="onDragEnd()"
    (wheel)="onWheelScroll($event)"
  >
    @for (clip of actionClips; track $index) {
      <div class="short-clip-card">
        <video
          #autoVideo
          muted
          loop
          playsinline
          preload="metadata"
          [attr.data-webm]="clip.webm"
          [attr.data-mp4]="clip.mp4"
        ></video>
      </div>
    }
  </div>
</section>
